<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Invisible reCAPTCHA (like Oracle / Workday)</title></head>
<body>
  <!-- Background bot check only: nothing for the student to solve, so no CAPTCHA warning. -->
  <form id="f" onsubmit="window.__goforitSubmitted = true; return false;">
    <label for="first">First Name</label><input id="first">
    <label for="email">Email</label><input id="email" type="email">
    <textarea id="g-recaptcha-response" name="g-recaptcha-response" style="display:none"></textarea>
    <button type="submit">Next</button>
  </form>
  <div class="grecaptcha-badge" style="position:fixed;right:0;bottom:14px;width:256px;height:60px">
    <iframe title="reCAPTCHA" src="/test-forms/none/recaptcha/api2/anchor?size=invisible" width="256" height="60"></iframe>
  </div>
  <iframe title="recaptcha challenge" src="/test-forms/none/recaptcha/api2/bframe" style="width:0;height:0;border:0"></iframe>
</body>
</html>
